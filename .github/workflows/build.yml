name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cropcast
          path: target/release/cropcast.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$env:GITHUB_REF_NAME" target/release/cropcast.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
