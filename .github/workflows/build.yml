name: build

on:
  push:
    branches: [main, worktree-agent-acb57389d79b5aa74]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cropcast
          path: target/release/cropcast.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$env:GITHUB_REF_NAME" target/release/cropcast.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  driver:
    # windows-2022 ships the WDK itself (10.1.26100); the 2025 images only have its VS extension.
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      SUDOVDA_COMMIT: a4b09fa2aa731a964d0cb5d139cb1e6240e4da12
      HAVE_PFX: ${{ secrets.DRIVER_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: SudoMaker/SudoVDA
          ref: ${{ env.SUDOVDA_COMMIT }}
          path: sudovda
          persist-credentials: false
      - run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # 64-bit MSBuild: the x86 one can't load the WDK's x86\InfVerif.dll on this image.
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find MSBuild\**\Bin\amd64\MSBuild.exe
          & $msbuild "sudovda\Virtual Display Driver (HDR)\SudoVDA.sln" /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off
          $out = "sudovda\Virtual Display Driver (HDR)\x64\Release\SudoVDA"
          New-Item -ItemType Directory driver | Out-Null
          Copy-Item "$out\SudoVDA.inf", "$out\SudoVDA.dll" driver
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x86\Inf2Cat.exe" /driver:driver /os:10_X64
          Get-ChildItem driver
      # Secrets only on pushes to this repo; forks and PRs get an unsigned package.
      - id: sign
        if: github.event_name == 'push' && env.HAVE_PFX == 'true'
        env:
          PFX_BASE64: ${{ secrets.DRIVER_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.DRIVER_PFX_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pfx = "$env:RUNNER_TEMP\driver.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /fd sha256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 driver\sudovda.cat
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:PFX_PASSWORD)
          [IO.File]::WriteAllBytes("$PWD\driver\cropcast-driver.cer", $cert.Export('Cert'))
          Remove-Item $pfx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.sign.outcome == 'success' && 'driver' || 'driver-unsigned' }}
          path: driver
